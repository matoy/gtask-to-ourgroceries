[project]
name = "gtask-to-ourgroceries"
version = "0.1.0"
description = "Serverless bridge from Google Keep / Google Tasks to OurGroceries"
requires-python = ">=3.11"
dependencies = [
    "gkeepapi>=0.17.1",
    "google-api-python-client>=2.118.0",
    "google-auth>=2.28.1",
    "google-auth-httplib2>=0.2.0",
    "ourgroceries>=1.5.0",
]

[tool.vercel]
entrypoint = "api.sync:handler"

[tool.pyrefly]
search-path = ["."]
ignore-missing-imports = [
    "gkeepapi",
    "gkeepapi.*",
    "google.*",
    "googleapiclient.*",
    "gpsoauth",
    "gpsoauth.*",
    "ourgroceries",
    "ourgroceries.*",
]
